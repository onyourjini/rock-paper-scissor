<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rock Paper Scissors</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="game">
    <h1>Rock Paper Scissors</h1>
    <div class="scoreboard">
        <div class="score-box">
            <span class="score-label">You</span>
            <span id="playerScore" class="score-value">0</span>
        </div>
        <div class="score-box">
            <span class="score-label">Ties</span>
            <span id="tieScore" class="score-value">0</span>
        </div>
        <div class="score-box">
            <span class="score-label">CPU</span>
            <span id="cpuScore" class="score-value">0</span>
        </div>
    </div>
    <div id="streakBox" class="streak hidden">🔥 <span id="streakCount">0</span> win streak!</div>

    <div class="battle">
        <div class="hand-slot">
            <div id="playerHand" class="hand">✊</div>
            <span class="hand-label">You</span>
        </div>
        <div class="vs">VS</div>
        <div class="hand-slot">
            <div id="cpuHand" class="hand">✊</div>
            <span class="hand-label">CPU</span>
        </div>
    </div>
    <div id="resultMsg" class="result-msg">Choose your move!</div>
    <div class="choices">
        <button class="choice-btn" data-choice="rock">✊<span>Rock</span></button>
        <button class="choice-btn" data-choice="paper">✋<span>Paper</span></button>
        <button class="choice-btn" data-choice="scissors">✌️<span>Scissors</span></button>
    </div>
    <button id="resetBtn" class="reset-btn">Reset Score</button>
</div>

<script src="script.js"></script>
</body>
</html>
